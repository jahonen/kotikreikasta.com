steps:
  # Build the Docker image — secrets injected via secretEnv, shell-expanded into --build-arg
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    secretEnv:
      - 'NEXT_PUBLIC_FIREBASE_API_KEY'
      - 'NEXT_PUBLIC_FIREBASE_APP_ID'
      - 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID'
      - 'NEXT_PUBLIC_RECAPTCHA_SITE_KEY'
      - 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_FIREBASE_API_KEY="$$NEXT_PUBLIC_FIREBASE_API_KEY" \
          --build-arg NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=kotikreikasta.firebaseapp.com \
          --build-arg NEXT_PUBLIC_FIREBASE_PROJECT_ID=kotikreikasta \
          --build-arg NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=kotikreikasta.firebasestorage.app \
          --build-arg NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=854585552743 \
          --build-arg NEXT_PUBLIC_FIREBASE_APP_ID="$$NEXT_PUBLIC_FIREBASE_APP_ID" \
          --build-arg NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID="$$NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID" \
          --build-arg NEXT_PUBLIC_RECAPTCHA_SITE_KEY="$$NEXT_PUBLIC_RECAPTCHA_SITE_KEY" \
          --build-arg NEXT_PUBLIC_GOOGLE_MAPS_API_KEY="$$NEXT_PUBLIC_GOOGLE_MAPS_API_KEY" \
          -t europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:$SHORT_SHA \
          -t europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:latest \
          .
    dir: 'admin'

  # Push the Docker image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:$SHORT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:latest'

  # Deploy to Cloud Run (private — Firebase Hosting provides invoker identity)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'ssradmin'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:$SHORT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--no-allow-unauthenticated'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '60'
      - '--update-env-vars'
      - 'NODE_ENV=production'
      - '--update-env-vars'
      - 'GCLOUD_PROJECT=$PROJECT_ID'
      - '--update-env-vars'
      - 'FIREBASE_PROJECT_ID=kotikreikasta'
      - '--update-env-vars'
      - 'FIREBASE_STORAGE_BUCKET=kotikreikasta.firebasestorage.app'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_WEB_API_KEY_ADMIN/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_API_KEY'
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_APP_ID_ADMIN/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_APP_ID'
    - versionName: projects/$PROJECT_ID/secrets/FIREBASE_MEASUREMENT_ID_ADMIN/versions/latest
      env: 'NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID'
    - versionName: projects/$PROJECT_ID/secrets/RECAPTCHA_ENTERPRISE_SITE_KEY/versions/latest
      env: 'NEXT_PUBLIC_RECAPTCHA_SITE_KEY'
    - versionName: projects/$PROJECT_ID/secrets/MAPS_JS_BROWSER_KEY/versions/latest
      env: 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:$SHORT_SHA'
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ssradmin:latest'

options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY
